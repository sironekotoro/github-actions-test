name: Run Agent Dispatch
description: Run the authenticated Agent Dispatch pipeline after the dispatcher checkout.
inputs:
  execution_mode:
    description: github or self-hosted
    required: true
  github_token:
    description: Dispatcher repository workflow token
    required: true
  cross_repo_enabled:
    description: Existing cross-repository feature flag value
    required: true
  app_id:
    description: GitHub App id for cross-repository dispatch
    required: false
  app_private_key:
    description: GitHub App private key for cross-repository dispatch
    required: false
  openrouter_api_key:
    description: OpenRouter API key supplied only to the selected agent runtime
    required: true
  openrouter_model:
    description: Model override
    required: true
runs:
  using: composite
  steps:
    - name: Authorize actor
      id: authorize
      shell: bash
      env:
        GH_ACTOR: ${{ github.actor }}
        ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        ISSUE_SENDER: ${{ github.event.sender.login }}
        EVENT_NAME: ${{ github.event_name }}
      run: bash scripts/authorize-actor.sh

    - name: Parse task
      id: parse
      shell: bash
      env:
        EVENT_PATH: ${{ github.event_path }}
        DISPATCH_INPUTS: ${{ github.event_name == 'workflow_dispatch' && toJson(github.event.inputs) || '' }}
      run: node scripts/parse-task.mjs

    - name: Verify dispatcher checkout identity
      id: dispatcher_guard
      shell: bash
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash scripts/guard-dispatcher-repo.sh

    - name: Authorize target repository
      id: target
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
        DISPATCHER_REPOSITORY: ${{ github.repository }}
        CROSS_REPO_ENABLED: ${{ inputs.cross_repo_enabled }}
      run: bash scripts/authorize-target.sh

    - name: Same-repo identity guard
      id: same_guard
      if: steps.target.outputs.mode == 'same'
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash scripts/guard-repo.sh

    # Keep trusted dispatcher control code on the workflow ref. Unlike the
    # GitHub-hosted legacy path, self-hosted execution must not switch that
    # checkout to the target's default branch before it invokes local scripts.
    - name: Checkout same-repo target separately
      id: same_target_checkout
      if: steps.target.outputs.mode == 'same' && steps.same_guard.outputs.result == 'pass'
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.target.outputs.target_repository }}
        token: ${{ inputs.github_token }}
        fetch-depth: 0
        path: target
        persist-credentials: true

    - name: Re-verify same-repo target checkout identity
      id: same_target_guard
      if: steps.same_target_checkout.outcome == 'success'
      working-directory: target
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
      run: bash ../scripts/guard-target-repo.sh

    - name: Check cross-repo GitHub App configuration
      id: cross_auth
      if: steps.target.outputs.mode == 'cross'
      shell: bash
      env:
        GH_APP_ID: ${{ inputs.app_id }}
        GH_APP_PRIVATE_KEY: ${{ inputs.app_private_key }}
      run: bash scripts/check-cross-repo-auth.sh

    - name: Create target-scoped GitHub App token
      id: app_token
      if: steps.target.outputs.mode == 'cross' && steps.cross_auth.outputs.result == 'pass'
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ steps.target.outputs.target_owner }}
        repositories: ${{ steps.target.outputs.target_name }}
        permission-contents: write
        permission-pull-requests: write

    - name: Classify GitHub App token failure
      if: steps.target.outputs.mode == 'cross' && steps.cross_auth.outputs.result == 'pass' && steps.app_token.outcome != 'success'
      shell: bash
      run: |
        source scripts/lib/common.sh
        fail_with "$CAT_APP_TOKEN_FAILED" "could not create a target-scoped installation token"

    - name: Checkout cross-repo target
      id: target_checkout
      if: steps.target.outputs.mode == 'cross' && steps.app_token.outcome == 'success'
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.target.outputs.target_repository }}
        token: ${{ steps.app_token.outputs.token }}
        fetch-depth: 0
        path: target
        persist-credentials: true

    - name: Classify target checkout failure
      if: steps.target.outputs.mode == 'cross' && steps.app_token.outcome == 'success' && steps.target_checkout.outcome != 'success'
      shell: bash
      run: |
        source scripts/lib/common.sh
        fail_with "$CAT_TARGET_CHECKOUT" "target repository checkout failed"

    - name: Cross-repo target identity guard
      id: cross_guard
      if: steps.target.outputs.mode == 'cross' && steps.target_checkout.outcome == 'success'
      working-directory: target
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
      run: bash ../scripts/guard-target-repo.sh

    - name: Same-repo dry-run inspection
      id: dry_same
      if: steps.target.outputs.mode == 'same' && steps.same_target_guard.outputs.result == 'pass' && steps.parse.outputs.dry_run == 'true'
      working-directory: target
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
        GH_TOKEN: ${{ inputs.github_token }}
      run: bash ../scripts/inspect-target.sh

    - name: Cross-repo dry-run inspection
      id: dry_cross
      if: steps.target.outputs.mode == 'cross' && steps.cross_guard.outputs.result == 'pass' && steps.parse.outputs.dry_run == 'true'
      working-directory: target
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
      run: bash ../scripts/inspect-target.sh

    - name: Prepare same-repo agent branch
      id: prep_same
      if: steps.target.outputs.mode == 'same' && steps.same_target_guard.outputs.result == 'pass' && steps.parse.outputs.dry_run != 'true'
      working-directory: target
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
        GH_TOKEN: ${{ inputs.github_token }}
        DISPATCH_MODE: same
      run: bash ../scripts/prepare-branch.sh

    - name: Prepare cross-repo agent branch
      id: prep_cross
      if: steps.target.outputs.mode == 'cross' && steps.cross_guard.outputs.result == 'pass' && steps.parse.outputs.dry_run != 'true'
      working-directory: target
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
        DISPATCH_MODE: cross
      run: bash ../scripts/prepare-branch.sh

    - name: Build isolated Agent Dispatch images
      id: isolated_images
      if: inputs.execution_mode == 'self-hosted' && (steps.prep_same.outputs.result == 'pass' || steps.prep_cross.outputs.result == 'pass')
      shell: bash
      run: |
        docker build --tag "agent-dispatch-agent:$GITHUB_RUN_ID" --file docker/review-repair-agent.Dockerfile .
        docker build --tag "agent-dispatch-egress:$GITHUB_RUN_ID" --file docker/review-repair-egress.Dockerfile .

    - name: Run same-repo coding agent on GitHub-hosted runner
      id: agent_same_hosted
      if: inputs.execution_mode == 'github' && steps.prep_same.outputs.result == 'pass'
      working-directory: target
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        OPENROUTER_MODEL: ${{ inputs.openrouter_model }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: bash ../scripts/run-agent.sh

    - name: Run cross-repo coding agent on GitHub-hosted runner
      id: agent_cross_hosted
      if: inputs.execution_mode == 'github' && steps.prep_cross.outputs.result == 'pass'
      working-directory: target
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        OPENROUTER_MODEL: ${{ inputs.openrouter_model }}
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
      run: bash ../scripts/run-agent.sh

    - name: Run same-repo coding agent in isolated container
      id: agent_same_isolated
      if: inputs.execution_mode == 'self-hosted' && steps.isolated_images.outcome == 'success' && steps.prep_same.outputs.result == 'pass'
      working-directory: target
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        # Keep ordinary task semantics: task JSON wins over the workflow model
        # input, and an omitted max_runtime uses run-agent.sh's 10 minute default.
        OPENROUTER_MODEL: ${{ steps.parse.outputs.requested_model || inputs.openrouter_model }}
        AGENT_MAX_RUNTIME: ${{ steps.parse.outputs.max_runtime || '10' }}
      run: bash ../scripts/run-agent-dispatch-container.sh

    - name: Run cross-repo coding agent in isolated container
      id: agent_cross_isolated
      if: inputs.execution_mode == 'self-hosted' && steps.isolated_images.outcome == 'success' && steps.prep_cross.outputs.result == 'pass'
      working-directory: target
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        OPENROUTER_MODEL: ${{ steps.parse.outputs.requested_model || inputs.openrouter_model }}
        AGENT_MAX_RUNTIME: ${{ steps.parse.outputs.max_runtime || '10' }}
      run: bash ../scripts/run-agent-dispatch-container.sh

    - name: Commit, push, and create same-repo PR
      id: commit_same
      if: steps.agent_same_hosted.outputs.result == 'pass' || steps.agent_same_isolated.outputs.result == 'pass'
      working-directory: target
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
        GH_TOKEN: ${{ inputs.github_token }}
        DEFAULT_BRANCH: ${{ steps.prep_same.outputs.default_branch }}
        OPENROUTER_MODEL: ${{ inputs.openrouter_model }}
        DISPATCH_MODE: same
        DISPATCHER_REPOSITORY: ${{ github.repository }}
        AGENT_TESTS_ALREADY_RAN: ${{ inputs.execution_mode == 'self-hosted' && 'true' || 'false' }}
        # The isolated path must not execute a target-provided Git hook in the
        # trusted outer executor. Git ignores these values for hosted mode.
        GIT_CONFIG_COUNT: ${{ inputs.execution_mode == 'self-hosted' && '1' || '0' }}
        GIT_CONFIG_KEY_0: core.hooksPath
        GIT_CONFIG_VALUE_0: /dev/null
      run: bash ../scripts/commit-push-pr.sh

    - name: Commit, push, and create cross-repo PR
      id: commit_cross
      if: steps.agent_cross_hosted.outputs.result == 'pass' || steps.agent_cross_isolated.outputs.result == 'pass'
      working-directory: target
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
        DEFAULT_BRANCH: ${{ steps.prep_cross.outputs.default_branch }}
        OPENROUTER_MODEL: ${{ inputs.openrouter_model }}
        DISPATCH_MODE: cross
        DISPATCHER_REPOSITORY: ${{ github.repository }}
        DISPATCH_PRINCIPAL: ${{ steps.app_token.outputs.app-slug }}[bot]
        AGENT_TESTS_ALREADY_RAN: ${{ inputs.execution_mode == 'self-hosted' && 'true' || 'false' }}
        GIT_CONFIG_COUNT: ${{ inputs.execution_mode == 'self-hosted' && '1' || '0' }}
        GIT_CONFIG_KEY_0: core.hooksPath
        GIT_CONFIG_VALUE_0: /dev/null
      run: bash ../scripts/commit-push-pr.sh

    - name: Feedback and step summary
      if: always()
      shell: bash
      env:
        TASK_FILE: ${{ runner.temp }}/task.json
        GH_TOKEN: ${{ inputs.github_token }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        AGENT_BRANCH: ${{ steps.prep_cross.outputs.branch || steps.prep_same.outputs.branch }}
        PR_URL: ${{ steps.commit_cross.outputs.pr_url || steps.commit_same.outputs.pr_url }}
        PR_NUMBER: ${{ steps.commit_cross.outputs.pr_number || steps.commit_same.outputs.pr_number }}
      run: bash scripts/post-feedback.sh

    - name: Remove separate target checkout
      if: always()
      shell: bash
      run: |
        # This checkout holds the outer executor's short-lived Git credential.
        # It is separate from the runner's normal dispatcher worktree and must
        # not persist under _work after a self-hosted dispatch.
        target_dir="$GITHUB_WORKSPACE/target"
        if [ -d "$target_dir" ] || [ -L "$target_dir" ]; then
          rm -rf -- "$target_dir"
        fi

    - name: Remove per-run isolated images
      if: always() && inputs.execution_mode == 'self-hosted'
      shell: bash
      run: |
        # The tags are deterministically scoped to this workflow run. Ignore a
        # missing image so this cleanup also covers partial image-build failures.
        docker image rm -f "agent-dispatch-agent:$GITHUB_RUN_ID" >/dev/null 2>&1 || true
        docker image rm -f "agent-dispatch-egress:$GITHUB_RUN_ID" >/dev/null 2>&1 || true
