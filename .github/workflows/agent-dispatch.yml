name: Agent Dispatch

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      target_repository:
        description: 'Target repository as owner/name'
        required: true
      task_id:
        description: 'Unique task id (branch will be agent/<task_id>)'
        required: true
      title:
        description: 'Short title for the PR / report'
        required: true
      prompt:
        description: 'Task instructions for the coding agent'
        required: true
      model:
        description: 'Provider model override'
        required: false
        default: ''
      agent:
        description: 'Coding agent: opencode (default), codex, or claude-code'
        required: false
        type: choice
        options: [opencode, codex, claude-code]
        default: opencode
      runner_mode:
        description: 'Execution runner: self-hosted for agent work; github is dry-run only'
        required: false
        type: choice
        options: [self-hosted, github]
        default: self-hosted
      dry_run:
        description: 'Validate auth/checkout/identity/default branch/prompt without running the agent or mutating the target'
        required: false
        type: boolean
        default: false

concurrency:
  group: agent-dispatch-${{ inputs.target_repository || github.repository }}-${{ github.event.issue.number || inputs.task_id }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || contains(fromJSON('["opencode-run","agent:ready"]'), github.event.label.name) }}
    outputs:
      runner_mode: ${{ steps.parse.outputs.runner_mode }}
      agent: ${{ steps.parse.outputs.agent }}
      dry_run: ${{ steps.parse.outputs.dry_run }}
      task_id: ${{ steps.parse.outputs.task_id }}
      target_repository: ${{ steps.parse.outputs.target_repository }}
      route_decision: ${{ steps.route_policy.outputs.decision }}
      wait_reason: ${{ steps.route_policy.outputs.reason }}
      runner_labels: ${{ steps.route_policy.outputs.runner_labels }}
      runner_state: ${{ steps.runner.outputs.state }}
      budget_state: ${{ steps.budget.outputs.state }}
      budget_reason: ${{ steps.budget.outputs.reason }}
      budget_provider: ${{ steps.budget.outputs.provider }}
      budget_available_usd: ${{ steps.budget.outputs.available_usd }}
      budget_hard_floor_usd: ${{ steps.budget.outputs.hard_floor_usd }}
      budget_warning_usd: ${{ steps.budget.outputs.warning_usd }}
      budget_job_spendable_usd: ${{ steps.budget.outputs.job_spendable_usd }}
      budget_required_job_reserve_usd: ${{ steps.budget.outputs.required_job_reserve_usd }}
    steps:
      - name: Checkout dispatcher repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize actor before control-plane preflight
        id: authorize
        env:
          ACTOR_ALLOWLIST: 'sironekotoro'
          GH_ACTOR: ${{ github.actor }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_SENDER: ${{ github.event.sender.login }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/authorize-actor.sh

      - name: Parse task and select runner mode
        id: parse
        env:
          EVENT_PATH: ${{ github.event_path }}
          DISPATCH_INPUTS: ${{ github.event_name == 'workflow_dispatch' && toJson(inputs) || '' }}
        run: node scripts/parse-task.mjs

      - name: Validate self-hosted runner configuration
        if: steps.parse.outputs.runner_mode == 'self-hosted'
        env:
          AGENT_DISPATCH_RUNNER_LABELS: ${{ vars.REVIEW_REPAIR_RUNNER_LABELS }}
        run: bash scripts/check-agent-dispatch-runner.sh

      - name: Check compatible self-hosted runner availability
        id: runner
        if: steps.parse.outputs.runner_mode == 'self-hosted' && steps.parse.outputs.dry_run != 'true'
        env:
          RUNNER_ROUTER_ENABLED: ${{ vars.RUNNER_ROUTER_ENABLED || 'false' }}
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          RUNNER_REQUIRED_LABELS: ${{ vars.REVIEW_REPAIR_RUNNER_LABELS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-runner-availability.mjs

      - name: Check paid provider budget
        id: budget
        if: steps.parse.outputs.runner_mode == 'self-hosted' && steps.parse.outputs.dry_run != 'true' && steps.runner.outputs.decision == 'run'
        env:
          AGENT: ${{ steps.parse.outputs.agent }}
          PROVIDER_BUDGET_GATE_ENABLED: ${{ vars.PROVIDER_BUDGET_GATE_ENABLED || 'false' }}
          PROVIDER_BALANCE_WARN_USD: ${{ vars.PROVIDER_BALANCE_WARN_USD || '0.50' }}
          PROVIDER_BALANCE_HARD_FLOOR_USD: ${{ vars.PROVIDER_BALANCE_HARD_FLOOR_USD || '0.25' }}
          PROVIDER_JOB_MAX_USD: ${{ vars.PROVIDER_JOB_MAX_USD || '0.25' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MANAGEMENT_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          OPENAI_MONTHLY_BUDGET_USD: ${{ vars.OPENAI_MONTHLY_BUDGET_USD }}
        run: node scripts/provider-budget-preflight.mjs

      - name: Resolve execution route
        id: route_policy
        shell: bash
        env:
          RUNNER_MODE: ${{ steps.parse.outputs.runner_mode }}
          DRY_RUN: ${{ steps.parse.outputs.dry_run }}
          RUNNER_DECISION: ${{ steps.runner.outputs.decision }}
          RUNNER_REASON: ${{ steps.runner.outputs.reason }}
          RUNNER_LABELS: ${{ steps.runner.outputs.runner_labels }}
          FALLBACK_RUNNER_LABELS: ${{ vars.REVIEW_REPAIR_RUNNER_LABELS }}
          BUDGET_DECISION: ${{ steps.budget.outputs.decision }}
          BUDGET_REASON: ${{ steps.budget.outputs.reason }}
        run: |
          set -euo pipefail
          decision=''
          reason=''
          labels="${RUNNER_LABELS:-${FALLBACK_RUNNER_LABELS:-[]}}"
          if [ "$RUNNER_MODE" = github ] && [ "$DRY_RUN" = true ]; then
            decision=github-dry-run
            labels='[]'
          elif [ "$RUNNER_MODE" = self-hosted ] && [ "$DRY_RUN" = true ]; then
            decision=run-self-hosted
          elif [ "$RUNNER_MODE" = self-hosted ] && [ "${RUNNER_DECISION:-wait}" != run ]; then
            decision=wait-runner
            reason="${RUNNER_REASON:-RUNNER_STATUS_UNKNOWN}"
          elif [ "$RUNNER_MODE" = self-hosted ] && [ "${BUDGET_DECISION:-wait}" != pass ]; then
            decision=wait-budget
            reason="${BUDGET_REASON:-PROVIDER_BUDGET_UNKNOWN}"
          elif [ "$RUNNER_MODE" = self-hosted ]; then
            decision=run-self-hosted
          else
            echo 'INVALID_PAYLOAD: unresolved runner route' >&2
            exit 1
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "runner_labels=$labels" >> "$GITHUB_OUTPUT"

  agent_github:
    name: Agent Dispatch (GitHub-hosted dry-run only)
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    if: needs.route.result == 'success' && needs.route.outputs.runner_mode == 'github' && needs.route.outputs.dry_run == 'true'
    env:
      ACTOR_ALLOWLIST: 'sironekotoro'
      CROSS_REPO_ENABLED: ${{ vars.CROSS_REPO_ENABLED || 'false' }}

    steps:
      - name: Checkout dispatcher repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize actor
        id: authorize
        env:
          GH_ACTOR: ${{ github.actor }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_SENDER: ${{ github.event.sender.login }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/authorize-actor.sh

      - name: Parse task
        id: parse
        env:
          EVENT_PATH: ${{ github.event_path }}
          DISPATCH_INPUTS: ${{ github.event_name == 'workflow_dispatch' && toJson(inputs) || '' }}
        run: node scripts/parse-task.mjs

      - name: Verify dispatcher checkout identity
        id: dispatcher_guard
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/guard-dispatcher-repo.sh

      - name: Authorize target repository
        id: target
        env:
          TASK_FILE: ${{ runner.temp }}/task.json
          DISPATCHER_REPOSITORY: ${{ github.repository }}
          CROSS_REPO_ENABLED: ${{ env.CROSS_REPO_ENABLED }}
        run: bash scripts/authorize-target.sh

      - name: Same-repo identity guard
        id: same_guard
        if: steps.target.outputs.mode == 'same'
        env:
          TASK_FILE: ${{ runner.temp }}/task.json
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/guard-repo.sh

      - name: Check cross-repo GitHub App configuration
        id: cross_auth
        if: steps.target.outputs.mode == 'cross'
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: bash scripts/check-cross-repo-auth.sh

      - name: Create read-only target-scoped GitHub App token
        id: app_token
        if: steps.target.outputs.mode == 'cross' && steps.cross_auth.outputs.result == 'pass'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.target_owner }}
          repositories: ${{ steps.target.outputs.target_name }}
          permission-contents: read
          permission-pull-requests: read

      - name: Classify GitHub App token failure
        if: steps.target.outputs.mode == 'cross' && steps.cross_auth.outputs.result == 'pass' && steps.app_token.outcome != 'success'
        run: |
          source scripts/lib/common.sh
          fail_with "$CAT_APP_TOKEN_FAILED" "could not create a target-scoped installation token"

      - name: Checkout cross-repo target read-only
        id: target_checkout
        if: steps.target.outputs.mode == 'cross' && steps.app_token.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.target.outputs.target_repository }}
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Classify target checkout failure
        if: steps.target.outputs.mode == 'cross' && steps.app_token.outcome == 'success' && steps.target_checkout.outcome != 'success'
        run: |
          source scripts/lib/common.sh
          fail_with "$CAT_TARGET_CHECKOUT" "target repository checkout failed"

      - name: Cross-repo target identity guard
        id: cross_guard
        if: steps.target.outputs.mode == 'cross' && steps.target_checkout.outcome == 'success'
        working-directory: target
        env:
          TASK_FILE: ${{ runner.temp }}/task.json
        run: bash ../scripts/guard-target-repo.sh

      - name: Same-repo dry-run inspection
        id: dry_same
        if: steps.target.outputs.mode == 'same' && steps.same_guard.outputs.result == 'pass'
        env:
          TASK_FILE: ${{ runner.temp }}/task.json
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/inspect-target.sh

      - name: Cross-repo dry-run inspection
        id: dry_cross
        if: steps.target.outputs.mode == 'cross' && steps.cross_guard.outputs.result == 'pass'
        working-directory: target
        env:
          TASK_FILE: ${{ runner.temp }}/task.json
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: bash ../scripts/inspect-target.sh

      - name: Feedback and step summary
        if: always()
        env:
          TASK_FILE: ${{ runner.temp }}/task.json
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: bash scripts/post-feedback.sh

  control_feedback:
    name: Agent Dispatch control-plane feedback
    needs: route
    if: needs.route.result == 'success' && (startsWith(needs.route.outputs.route_decision, 'wait-') || contains(fromJSON('["ok","warning","blocked","unknown"]'), needs.route.outputs.budget_state))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted dispatcher control code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reconcile provider budget alert and email
        if: needs.route.outputs.budget_state != '' && needs.route.outputs.budget_state != 'disabled'
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.route.outputs.task_id }}
          BUDGET_PROVIDER: ${{ needs.route.outputs.budget_provider }}
          BUDGET_STATE: ${{ needs.route.outputs.budget_state }}
          BUDGET_AVAILABLE_USD: ${{ needs.route.outputs.budget_available_usd }}
          BUDGET_HARD_FLOOR_USD: ${{ needs.route.outputs.budget_hard_floor_usd }}
          BUDGET_REQUIRED_JOB_RESERVE_USD: ${{ needs.route.outputs.budget_required_job_reserve_usd }}
          BILLING_EMAIL_ENABLED: ${{ vars.BILLING_EMAIL_ENABLED || 'false' }}
          BILLING_ALERT_RECOVERY_EMAIL: ${{ vars.BILLING_ALERT_RECOVERY_EMAIL || 'false' }}
          BILLING_ALERT_EMAIL_TO: ${{ vars.BILLING_ALERT_EMAIL_TO }}
          BILLING_SMTP_HOST: ${{ vars.BILLING_SMTP_HOST }}
          BILLING_SMTP_PORT: ${{ vars.BILLING_SMTP_PORT || '587' }}
          BILLING_SMTP_FROM: ${{ vars.BILLING_SMTP_FROM }}
          BILLING_SMTP_STARTTLS: ${{ vars.BILLING_SMTP_STARTTLS || 'true' }}
          BILLING_SMTP_SSL: ${{ vars.BILLING_SMTP_SSL || 'false' }}
          BILLING_SMTP_USER: ${{ secrets.BILLING_SMTP_USER }}
          BILLING_SMTP_PASSWORD: ${{ secrets.BILLING_SMTP_PASSWORD }}
        run: bash scripts/notify-budget-state.sh

      - name: Record deferred task and park ready label
        if: startsWith(needs.route.outputs.route_decision, 'wait-')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ROUTE_DECISION: ${{ needs.route.outputs.route_decision }}
          WAIT_REASON: ${{ needs.route.outputs.wait_reason }}
        run: bash scripts/post-route-waiting.sh

      - name: Notification state ACTION_REQUIRED task=${{ needs.route.outputs.task_id }} target=${{ needs.route.outputs.target_repository }} reason=${{ needs.route.outputs.wait_reason || 'ACTION_REQUIRED' }}
        if: startsWith(needs.route.outputs.route_decision, 'wait-')
        run: ':'

  agent_self_hosted:
    name: Agent Dispatch (self-hosted isolated)
    needs: route
    if: needs.route.result == 'success' && needs.route.outputs.route_decision == 'run-self-hosted'
    runs-on: ${{ fromJSON(needs.route.outputs.runner_labels) }}
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      ACTOR_ALLOWLIST: 'sironekotoro'
    steps:
      - name: Checkout dispatcher repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Run authenticated Agent Dispatch in isolated container
        uses: ./.github/actions/agent-dispatch
        env:
          OPENAI_ADMIN_KEY: ${{ needs.route.outputs.agent == 'codex' && vars.PROVIDER_BROKER_ENABLED == 'true' && secrets.OPENAI_ADMIN_KEY || '' }}
        with:
          execution_mode: self-hosted
          github_token: ${{ github.token }}
          cross_repo_enabled: ${{ vars.CROSS_REPO_ENABLED || 'false' }}
          app_id: ${{ secrets.GH_APP_ID }}
          app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          agent_credential: ${{ needs.route.outputs.agent == 'opencode' && vars.PROVIDER_BROKER_ENABLED != 'true' && secrets.OPENROUTER_API_KEY || needs.route.outputs.agent == 'codex' && vars.PROVIDER_BROKER_ENABLED != 'true' && secrets.OPENAI_API_KEY || needs.route.outputs.agent == 'claude-code' && secrets.ANTHROPIC_API_KEY || '' }}
          openrouter_model: ${{ inputs.model || 'openrouter/deepseek/deepseek-v4-flash' }}
          agent: ${{ needs.route.outputs.agent || 'opencode' }}
          provider_broker_enabled: ${{ contains(fromJSON('["opencode","codex"]'), needs.route.outputs.agent) && vars.PROVIDER_BROKER_ENABLED == 'true' && 'true' || 'false' }}
          provider_job_max_usd: ${{ vars.PROVIDER_JOB_MAX_USD || '0.25' }}
          openrouter_management_key: ${{ needs.route.outputs.agent == 'opencode' && vars.PROVIDER_BROKER_ENABLED == 'true' && secrets.OPENROUTER_MANAGEMENT_KEY || '' }}

      - name: Resolve Agent Dispatch notification failure category
        id: notification_failure
        if: failure()
        shell: bash
        run: |
          reason="$(cat "$RUNNER_TEMP/failure_category" 2>/dev/null || true)"
          [ -n "$reason" ] || reason='AGENT_DISPATCH_FAILED'
          printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"

      - name: Notification state TASK_FAILED task=${{ needs.route.outputs.task_id }} target=${{ needs.route.outputs.target_repository }} reason=${{ steps.notification_failure.outputs.reason || 'AGENT_DISPATCH_FAILED' }}
        if: failure()
        run: ':'

      - name: Notification state TASK_COMPLETED task=${{ needs.route.outputs.task_id }} target=${{ needs.route.outputs.target_repository }} reason=none
        if: success()
        run: ':'
