name: Codex Issue Worker

on:
  issues:
    types:
      - labeled

permissions:
  contents: read
  issues: read

jobs:
  codex:
    if: github.event.label.name == 'codex-run'

    runs-on: self-hosted

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "HOST=$(hostname)"
          echo "USER=$(whoami)"
          echo "PWD=$(pwd)"
          echo "PATH=$PATH"
          which codex
          codex --version

      - name: Run Codex
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat > "$RUNNER_TEMP/codex-prompt.txt" <<EOF
          You are working only in this repository.

          GitHub Issue #${ISSUE_NUMBER}

          Title:
          ${ISSUE_TITLE}

          Body:
          ${ISSUE_BODY}

          Perform only the requested task.

          Rules:
          - Work only inside this repository.
          - Do not access other repositories.
          - Do not push anything.
          - Do not create commits.
          - Do not create pull requests.
          - Do not modify unrelated files.
          - When finished, verify your work.
          EOF

          codex exec \
            --sandbox workspace-write \
            - < "$RUNNER_TEMP/codex-prompt.txt"

      - name: Show changes
        if: always()
        run: |
          echo "===== git status ====="
          git status --short

          echo "===== git diff ====="
          git diff