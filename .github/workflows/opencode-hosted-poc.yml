name: OpenCode Hosted PoC

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  opencode:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.label.name == 'opencode-run' && github.event.issue.user.login == 'sironekotoro') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare AI branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || 'manual' }}
        run: |
          BRANCH="ai/issue-${ISSUE_NUMBER}"
          echo "AI_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"

      - name: Install OpenCode
        run: |
          npm install -g opencode-ai
          opencode --version

      - name: Build prompt from issue event
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const event = JSON.parse(fs.readFileSync(process.env.EVENT_PATH, 'utf8'));
          const issue = event.issue || { number: 0, title: 'Manual OpenCode PoC', body: 'Reply with exactly: OPENCODE_HOSTED_POC_OK' };
          const prompt = [
            'You are working only in this checked-out GitHub repository.',
            '',
            `GitHub Issue #${issue.number}`,
            '',
            'Title:',
            issue.title,
            '',
            'Body:',
            issue.body || '',
            '',
            'Perform only the requested task.',
            '',
            'Rules:',
            '- Work only inside this repository.',
            '- Do not access other repositories.',
            '- Do not commit.',
            '- Do not push.',
            '- Do not create a pull request yourself.',
            '- Do not modify unrelated files.',
            '- Verify your work before finishing.'
          ].join('\n');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/opencode-prompt.txt', prompt);
          NODE

      - name: Run OpenCode via OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          opencode run \
            --model openrouter/deepseek/deepseek-v4-flash \
            "$(cat "$RUNNER_TEMP/opencode-prompt.txt")"

      - name: Show changes
        run: |
          echo '===== git status ====='
          git status --short
          echo '===== git diff ====='
          git diff

      - name: Run repository tests
        run: |
          if [ -f package.json ]; then
            npm test
          else
            echo 'No package.json; skipping npm test.'
          fi

      - name: Commit, push, and create Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '0' }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'Manual OpenCode PoC' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git commit -m "AI: issue #${ISSUE_NUMBER}"
          git push --set-upstream origin "$AI_BRANCH"

          if gh pr list --head "$AI_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --draft \
              --base master \
              --head "$AI_BRANCH" \
              --title "AI: ${ISSUE_TITLE}" \
              --body "Automated OpenCode/OpenRouter implementation for #${ISSUE_NUMBER}.\n\n- Trigger: \`opencode-run\`\n- Runner: GitHub-hosted Ubuntu\n- Repository test: PASS\n- \`git diff --check\`: PASS\n\nCloses #${ISSUE_NUMBER}"
          else
            echo "An open PR already exists for $AI_BRANCH."
          fi
