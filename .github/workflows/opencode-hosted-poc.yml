name: OpenCode Hosted PoC

on:
  issues:
    types:
      - labeled

permissions:
  contents: read
  issues: read

jobs:
  opencode:
    if: >-
      github.event.label.name == 'opencode-run' &&
      github.event.issue.user.login == 'sironekotoro'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install OpenCode
        run: |
          npm install -g opencode-ai
          opencode --version

      - name: Build prompt from issue event
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const event = JSON.parse(fs.readFileSync(process.env.EVENT_PATH, 'utf8'));
          const prompt = `You are working only in this checked-out GitHub repository.

GitHub Issue #${event.issue.number}

Title:
${event.issue.title}

Body:
${event.issue.body || ''}

Perform only the requested task.

Rules:
- Work only inside this repository.
- Do not access other repositories.
- Do not commit.
- Do not push.
- Do not create a pull request.
- Do not modify unrelated files.
- Verify your work before finishing.`;
          fs.writeFileSync(process.env.RUNNER_TEMP + '/opencode-prompt.txt', prompt);
          NODE

      - name: Run OpenCode via OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          PROMPT="$(cat "$RUNNER_TEMP/opencode-prompt.txt")"
          opencode run \
            --model openrouter/deepseek/deepseek-v4-flash \
            "$PROMPT"

      - name: Show changes
        if: always()
        run: |
          echo '===== git status ====='
          git status --short
          echo '===== git diff ====='
          git diff
