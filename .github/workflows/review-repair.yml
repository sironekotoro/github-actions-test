name: Agent Review Repair Dispatcher

on:
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  same-repo-review:
    if: ${{ vars.REVIEW_REPAIR_ENABLED == 'true' && github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: review-repair-dispatch-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      ACTOR_ALLOWLIST: 'sironekotoro'
      REVIEW_REPAIR_ENABLED: 'true'
      REVIEW_REPAIR_MAX: ${{ vars.REVIEW_REPAIR_MAX || '3' }}
      REVIEW_REPAIR_RUNNER_LABELS: ${{ vars.REVIEW_REPAIR_RUNNER_LABELS }}
    steps:
      - name: Checkout dispatcher repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify dispatcher checkout identity
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/guard-dispatcher-repo.sh

      - name: Require configured self-hosted executor
        id: executor_config
        run: bash scripts/check-review-executor.sh

      - name: Record detection time
        id: clock
        run: echo "detected_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Collect and validate submitted review
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          DISPATCHER_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          EVENT_ACTOR: ${{ github.actor }}
          STRICT_REVIEWER: 'true'
          DETECTED_AT: ${{ steps.clock.outputs.detected_at }}
          TASK_FILE: ${{ runner.temp }}/task.json
        run: bash scripts/collect-review-repair.sh

      - name: Re-authorize same-repo target
        id: target
        if: steps.context.outputs.decision == 'run' || steps.context.outputs.decision == 'limit-reached'
        env:
          TASK_FILE: ${{ runner.temp }}/task.json
          DISPATCHER_REPOSITORY: ${{ github.repository }}
          CROSS_REPO_ENABLED: 'false'
        run: bash scripts/authorize-target.sh

      - name: Re-verify same-repo identity
        if: steps.context.outputs.decision == 'run' && steps.target.outputs.mode == 'same'
        env:
          TASK_FILE: ${{ runner.temp }}/task.json
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/guard-repo.sh

      - name: Check compatible self-hosted executor availability
        id: runner
        if: steps.context.outputs.decision == 'run' && steps.target.outputs.mode == 'same'
        env:
          RUNNER_ROUTER_ENABLED: ${{ vars.RUNNER_ROUTER_ENABLED || 'false' }}
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          RUNNER_REQUIRED_LABELS: ${{ vars.REVIEW_REPAIR_RUNNER_LABELS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-runner-availability.mjs

      - name: Check OpenRouter budget before review repair
        id: budget
        if: steps.context.outputs.decision == 'run' && steps.target.outputs.mode == 'same' && steps.runner.outputs.decision == 'run'
        env:
          AGENT: opencode
          PROVIDER_BUDGET_GATE_ENABLED: ${{ vars.PROVIDER_BUDGET_GATE_ENABLED || 'false' }}
          PROVIDER_BALANCE_WARN_USD: ${{ vars.PROVIDER_BALANCE_WARN_USD || '0.50' }}
          PROVIDER_BALANCE_HARD_FLOOR_USD: ${{ vars.PROVIDER_BALANCE_HARD_FLOOR_USD || '0.25' }}
          PROVIDER_JOB_MAX_USD: ${{ vars.PROVIDER_JOB_MAX_USD || '0.25' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MANAGEMENT_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
        run: node scripts/provider-budget-preflight.mjs

      - name: Reconcile review-repair budget alert
        if: steps.budget.outputs.state != '' && steps.budget.outputs.state != 'disabled'
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: review-repair-${{ github.event.pull_request.number }}
          BUDGET_PROVIDER: ${{ steps.budget.outputs.provider }}
          BUDGET_STATE: ${{ steps.budget.outputs.state }}
          BUDGET_AVAILABLE_USD: ${{ steps.budget.outputs.available_usd }}
          BUDGET_HARD_FLOOR_USD: ${{ steps.budget.outputs.hard_floor_usd }}
          BUDGET_REQUIRED_JOB_RESERVE_USD: ${{ steps.budget.outputs.required_job_reserve_usd }}
          BILLING_EMAIL_ENABLED: ${{ vars.BILLING_EMAIL_ENABLED || 'false' }}
          BILLING_ALERT_RECOVERY_EMAIL: ${{ vars.BILLING_ALERT_RECOVERY_EMAIL || 'false' }}
          BILLING_ALERT_EMAIL_TO: ${{ vars.BILLING_ALERT_EMAIL_TO }}
          BILLING_SMTP_HOST: ${{ vars.BILLING_SMTP_HOST }}
          BILLING_SMTP_PORT: ${{ vars.BILLING_SMTP_PORT || '587' }}
          BILLING_SMTP_FROM: ${{ vars.BILLING_SMTP_FROM }}
          BILLING_SMTP_STARTTLS: ${{ vars.BILLING_SMTP_STARTTLS || 'true' }}
          BILLING_SMTP_SSL: ${{ vars.BILLING_SMTP_SSL || 'false' }}
          BILLING_SMTP_USER: ${{ secrets.BILLING_SMTP_USER }}
          BILLING_SMTP_PASSWORD: ${{ secrets.BILLING_SMTP_PASSWORD }}
        run: bash scripts/notify-budget-state.sh

      - name: Resolve review-repair preflight
        id: gate
        if: steps.context.outputs.decision == 'run' && steps.target.outputs.mode == 'same'
        shell: bash
        env:
          RUNNER_DECISION: ${{ steps.runner.outputs.decision }}
          RUNNER_REASON: ${{ steps.runner.outputs.reason }}
          BUDGET_DECISION: ${{ steps.budget.outputs.decision }}
          BUDGET_REASON: ${{ steps.budget.outputs.reason }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_DECISION:-wait}" != run ]; then
            echo 'decision=wait-runner' >> "$GITHUB_OUTPUT"
            echo "reason=${RUNNER_REASON:-RUNNER_STATUS_UNKNOWN}" >> "$GITHUB_OUTPUT"
          elif [ "${BUDGET_DECISION:-wait}" != pass ]; then
            echo 'decision=wait-budget' >> "$GITHUB_OUTPUT"
            echo "reason=${BUDGET_REASON:-PROVIDER_BUDGET_UNKNOWN}" >> "$GITHUB_OUTPUT"
          else
            echo 'decision=run' >> "$GITHUB_OUTPUT"
            echo 'reason=' >> "$GITHUB_OUTPUT"
          fi

      - name: Check target marker GitHub App configuration
        if: steps.target.outputs.mode == 'same' && (steps.gate.outputs.decision == 'run' || steps.context.outputs.decision == 'limit-reached')
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: bash scripts/check-cross-repo-auth.sh

      - name: Create same-repo target marker token
        id: app_token
        if: steps.target.outputs.mode == 'same' && (steps.gate.outputs.decision == 'run' || steps.context.outputs.decision == 'limit-reached')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.target_owner }}
          repositories: ${{ steps.target.outputs.target_name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Reserve review id and attempt
        id: reserve
        if: steps.gate.outputs.decision == 'run' && steps.app_token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TASK_FILE: ${{ runner.temp }}/task.json
          REPAIR_STATUS: started
          DETECTED_AT: ${{ steps.clock.outputs.detected_at }}
        run: bash scripts/mark-review-repair.sh

      - name: Dispatch self-hosted executor
        id: dispatch
        if: steps.reserve.outputs.result == 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_FILE: ${{ runner.temp }}/task.json
          DISPATCHER_REPOSITORY: ${{ github.repository }}
          DISPATCHER_REF: ${{ github.event.repository.default_branch }}
        run: bash scripts/dispatch-review-executor.sh

      - name: Dispatcher feedback and summary
        if: always() && steps.context.outputs.decision != ''
        env:
          TASK_FILE: ${{ runner.temp }}/task.json
          REPAIR_DECISION: ${{ steps.gate.outputs.decision || steps.context.outputs.decision }}
          REPAIR_WAIT_REASON: ${{ steps.gate.outputs.reason }}
          RESERVE_OUTCOME: ${{ steps.reserve.outcome }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
          TARGET_GH_TOKEN: ${{ steps.app_token.outputs.token }}
          DISPATCHER_GH_TOKEN: ${{ github.token }}
        run: bash scripts/post-review-dispatch-feedback.sh

      - name: Notification state ACTION_REQUIRED task=review-repair-${{ github.event.pull_request.number }} target=${{ github.repository }} reason=${{ steps.gate.outputs.reason || 'REPAIR_LIMIT_REACHED' }}
        if: always() && (startsWith(steps.gate.outputs.decision, 'wait-') || steps.context.outputs.decision == 'limit-reached')
        run: ':'

      - name: Resolve review dispatcher notification failure category
        id: notification_failure
        if: failure()
        shell: bash
        run: |
          reason="$(cat "$RUNNER_TEMP/failure_category" 2>/dev/null || true)"
          [ -n "$reason" ] || reason='REPAIR_DISPATCH_FAILED'
          printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"

      - name: Notification state TASK_FAILED task=review-repair-${{ github.event.pull_request.number }} target=${{ github.repository }} reason=${{ steps.notification_failure.outputs.reason || 'REPAIR_DISPATCH_FAILED' }}
        if: failure()
        run: ':'

  cross-repo-plan:
    if: ${{ vars.REVIEW_REPAIR_ENABLED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      REVIEW_REPAIR_RUNNER_LABELS: ${{ vars.REVIEW_REPAIR_RUNNER_LABELS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify dispatcher checkout identity
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/guard-dispatcher-repo.sh
      - name: Require configured self-hosted executor
        run: bash scripts/check-review-executor.sh
      - name: Check compatible self-hosted executor availability
        id: runner
        env:
          RUNNER_ROUTER_ENABLED: ${{ vars.RUNNER_ROUTER_ENABLED || 'false' }}
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          RUNNER_REQUIRED_LABELS: ${{ vars.REVIEW_REPAIR_RUNNER_LABELS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-runner-availability.mjs
      - name: Check OpenRouter budget before scheduled repair
        id: budget
        if: steps.runner.outputs.decision == 'run'
        env:
          AGENT: opencode
          PROVIDER_BUDGET_GATE_ENABLED: ${{ vars.PROVIDER_BUDGET_GATE_ENABLED || 'false' }}
          PROVIDER_BALANCE_WARN_USD: ${{ vars.PROVIDER_BALANCE_WARN_USD || '0.50' }}
          PROVIDER_BALANCE_HARD_FLOOR_USD: ${{ vars.PROVIDER_BALANCE_HARD_FLOOR_USD || '0.25' }}
          PROVIDER_JOB_MAX_USD: ${{ vars.PROVIDER_JOB_MAX_USD || '0.25' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MANAGEMENT_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
        run: node scripts/provider-budget-preflight.mjs
      - name: Reconcile scheduled review-repair budget alert
        if: steps.budget.outputs.state != '' && steps.budget.outputs.state != 'disabled'
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: review-repair-scheduled
          BUDGET_PROVIDER: ${{ steps.budget.outputs.provider }}
          BUDGET_STATE: ${{ steps.budget.outputs.state }}
          BUDGET_AVAILABLE_USD: ${{ steps.budget.outputs.available_usd }}
          BUDGET_HARD_FLOOR_USD: ${{ steps.budget.outputs.hard_floor_usd }}
          BUDGET_REQUIRED_JOB_RESERVE_USD: ${{ steps.budget.outputs.required_job_reserve_usd }}
          BILLING_EMAIL_ENABLED: ${{ vars.BILLING_EMAIL_ENABLED || 'false' }}
          BILLING_ALERT_RECOVERY_EMAIL: ${{ vars.BILLING_ALERT_RECOVERY_EMAIL || 'false' }}
          BILLING_ALERT_EMAIL_TO: ${{ vars.BILLING_ALERT_EMAIL_TO }}
          BILLING_SMTP_HOST: ${{ vars.BILLING_SMTP_HOST }}
          BILLING_SMTP_PORT: ${{ vars.BILLING_SMTP_PORT || '587' }}
          BILLING_SMTP_FROM: ${{ vars.BILLING_SMTP_FROM }}
          BILLING_SMTP_STARTTLS: ${{ vars.BILLING_SMTP_STARTTLS || 'true' }}
          BILLING_SMTP_SSL: ${{ vars.BILLING_SMTP_SSL || 'false' }}
          BILLING_SMTP_USER: ${{ secrets.BILLING_SMTP_USER }}
          BILLING_SMTP_PASSWORD: ${{ secrets.BILLING_SMTP_PASSWORD }}
        run: bash scripts/notify-budget-state.sh
      - name: Build allowlisted target matrix
        id: matrix
        if: steps.runner.outputs.decision == 'run' && steps.budget.outputs.decision == 'pass'
        env:
          DISPATCHER_REPOSITORY: ${{ github.repository }}
        run: bash scripts/build-review-matrix.sh

  cross-repo-review:
    needs: cross-repo-plan
    if: ${{ needs.cross-repo-plan.outputs.matrix != '' && needs.cross-repo-plan.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.cross-repo-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: review-repair-dispatch-${{ matrix.target.repository }}
      cancel-in-progress: false
    env:
      ACTOR_ALLOWLIST: 'sironekotoro'
      REVIEW_REPAIR_ENABLED: 'true'
      REVIEW_REPAIR_MAX: ${{ vars.REVIEW_REPAIR_MAX || '3' }}
    steps:
      - name: Checkout dispatcher repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify dispatcher checkout identity
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/guard-dispatcher-repo.sh

      - name: Check GitHub App configuration
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: bash scripts/check-cross-repo-auth.sh

      - name: Create target-scoped GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ matrix.target.owner }}
          repositories: ${{ matrix.target.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Record detection scan time
        id: clock
        run: echo "detected_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Find one eligible target review
        id: context
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TARGET_REPOSITORY: ${{ matrix.target.repository }}
          DISPATCHER_REPOSITORY: ${{ github.repository }}
          STRICT_REVIEWER: 'false'
          DETECTED_AT: ${{ steps.clock.outputs.detected_at }}
          TASK_FILE: ${{ runner.temp }}/task.json
        run: bash scripts/scan-review-repairs.sh

      - name: Re-authorize cross-repo target
        id: target
        if: steps.context.outputs.decision == 'run' || steps.context.outputs.decision == 'limit-reached'
        env:
          TASK_FILE: ${{ runner.temp }}/task.json
          DISPATCHER_REPOSITORY: ${{ github.repository }}
          CROSS_REPO_ENABLED: 'true'
        run: bash scripts/authorize-target.sh

      - name: Reserve review id and attempt
        id: reserve
        if: steps.context.outputs.decision == 'run' && steps.target.outputs.mode == 'cross'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TASK_FILE: ${{ runner.temp }}/task.json
          REPAIR_STATUS: started
          DETECTED_AT: ${{ steps.clock.outputs.detected_at }}
        run: bash scripts/mark-review-repair.sh

      - name: Dispatch self-hosted executor
        id: dispatch
        if: steps.reserve.outputs.result == 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_FILE: ${{ runner.temp }}/task.json
          DISPATCHER_REPOSITORY: ${{ github.repository }}
          DISPATCHER_REF: ${{ github.event.repository.default_branch }}
        run: bash scripts/dispatch-review-executor.sh

      - name: Dispatcher feedback and summary
        if: always() && steps.context.outputs.decision != '' && steps.context.outputs.decision != 'none'
        env:
          TASK_FILE: ${{ runner.temp }}/task.json
          REPAIR_DECISION: ${{ steps.context.outputs.decision }}
          REPAIR_WAIT_REASON: ''
          RESERVE_OUTCOME: ${{ steps.reserve.outcome }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
          TARGET_GH_TOKEN: ${{ steps.app_token.outputs.token }}
          DISPATCHER_GH_TOKEN: ${{ github.token }}
        run: bash scripts/post-review-dispatch-feedback.sh